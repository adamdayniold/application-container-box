      #   uses: appleboy/ssh-action@master
      #   with:
      #     host: ${{ secrets.PRODUCTION_SERVER_IP }}
      #     username: ${{ secrets.PRODUCTION_SERVER_USER }}
      #     key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      #     script: docker pull ...
