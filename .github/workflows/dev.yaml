name: CI/CD Docker Pipeline

on:
  push:
    branches:
      - development
      - stage
      - main

jobs:
  unit-testing:
    if: github.ref == 'refs/heads/development' || github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest Unit Test
        run: npm test

  build-dev:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    needs: unit-testing

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Docker Image (Development)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-stage:
    if: github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    needs: unit-testing

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Staging Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Replaces 'your-dockerhub-username' dynamically; assigns staging or production tag
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nextjs-app:stage
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Staging Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TUNNEL_SSH_HOST }}
          username: ${{ secrets.SERVER_USER_STAGE }}
          key: ${{ secrets.SSH_PRIVATE_KEY_STAGE }}
          port: ${{ secrets.SERVER_PORT_STAGE }}
          proxy_command: cloudflared access ssh --hostname %h
          script: |
            cd /var/www/nextjs-app
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker compose pull
            docker compose up -d

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Production Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nextjs-app:production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 💡 FUTURE PRODUCTION SSH DEPLOYMENT GOES HERE
